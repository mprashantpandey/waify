[program:ZyptosBaileysBridge]
command=/usr/bin/node src/baileys-worker.js
directory=/www/wwwroot/zyptos.com/voice-bridge
autorestart=true
startsecs=3
startretries=3
stdout_logfile=/www/server/panel/plugin/supervisor/log/ZyptosBaileysBridge.out.log
stderr_logfile=/www/server/panel/plugin/supervisor/log/ZyptosBaileysBridge.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
user=www
priority=903
numprocs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
process_name=%(program_name)s_%(process_num)02d
environment=NODE_ENV="production",ZYPTOS_BASE_URL="https://zyptos.com",BAILEYS_BRIDGE_PORT="3215",BAILEYS_SESSION_PATH="/www/wwwroot/zyptos.com/storage/baileys-sessions"
